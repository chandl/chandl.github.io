# Site settings
title: "Chandler Severson - Resume"
description: "Chandler Severson - Principal Software Engineer - Resume"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Chandler Severson"
resume_title:                   "Principal Software Engineer"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "me@chandl.io"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       ""
resume_contact_address:         ""

resume_header_contact_info:     "Vancouver, WA • me@chandl.io"
display_header_contact_info:    "true"

resume_header_intro: "<p>Staff-level engineer with 9+ years building and operating distributed systems at scale. Technical lead and founding member of teams from 0→1; strong in system design, cross-team alignment, and mentoring. Currently Principal Engineer at Oracle Health (patient portal); prior: OCI AI Infrastructure (data center &amp; GPU inventory), OCI control-plane database (1M+ req/s, 40+ regions), Nike (cloud-native retail), and healthcare integration.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        false
resume_section_skills:          true
resume_section_recognition:     true
resume_section_links:           false
resume_section_associations:    false
resume_section_interests:       false

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/chandl"
  #resume_twitter_url:           "http://twitter.com/"
  #resume_dribbble_url:          "https://dribbble.com/"
  # resume_facebook_url:          "insert Facebook URL here"
  resume_linkedin_url:          "https://linkedin.com/in/chandler-severson/"
  # resume_instagram_url:         "insert your Instagram URL here"
  resume_website_url:           "https://chandl.io"
  #resume_medium_url:            "https://medium.com/"
resume_print_social_links:      true

# Design settings
resume_theme:                   default

# Note: when editing locally, remember to restart
# your Jekyll server when you edit this file. Changes
# to _config.yml are only recognized when the server starts
plugins:
  - jekyll-redirect-from